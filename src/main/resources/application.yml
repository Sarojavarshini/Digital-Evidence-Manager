server:
  port: 8080

spring:
  application:
    name: digital-evidence-manager

  datasource:
    # Default MySQL connection
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/digital_evidence_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect

  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

# Cryptographic & Security Configurations
app:
  security:
    jwt-secret: DigitalEvidenceManagerSecretKeyForensicsProject2026SecureKeyWithSHA256
    jwt-expiration-ms: 86400000 # 24 Hours
    aes-secret-key: DEMVaultAES256KeySecretForensics
  upload:
    directory: ./uploads
